# ─────────────────────────────────────────
# TANGYSLICE COLLECTIVE — _config.yml
# ─────────────────────────────────────────

# Site identity
title:       Tangyslice Collective
description: "The Agency/SaaS Industrial Complex was built for a buyer journey AI just ended. We build what comes next — custom AI workflows, fractional CMO leadership, and tools you own."
url:         "https://timdailey.github.io"
baseurl:     "/tangyslice"

# Default social share image (1200x630px)
og_image: "/assets/img/og-default.webp"

# Author defaults
author:
  name: Tangyslice Collective

# Build settings
markdown:  kramdown
permalink: /:title/

# Collections
collections:
  posts:
    output: true
    permalink: /dispatch/:title/

# Default front matter
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: base
  - scope:
      path: ""
      type: posts
    values:
      layout: dispatch-post

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .gitignore
  - vendor/
