<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Start cookieyes banner -->
   <script id="cookieyes" type="text/javascript" src="https://cdn-cookieyes.com/client_data/814feb2301cc7e744510483b23511a17/script.js"></script> 
   <!-- End cookieyes banner -->

  <!-- Indexing -->
  {% if page.noindex %}<meta name="robots" content="noindex, nofollow">{% endif %}

  <!-- Primary meta -->
  <title>{% if page.title %}{{ page.title }} — {% endif %}Tangyslice Collective</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}" />
  <meta name="robots" content="index, follow" />

  <!-- Canonical -->
  <link rel="canonical" href="{{ page.url | absolute_url }}" />

  <!-- Open Graph -->
  <meta property="og:type"        content="{% if page.layout == 'blog-post' %}article{% else %}website{% endif %}" />
  <meta property="og:title"       content="{% if page.title %}{{ page.title }} — {% endif %}Tangyslice Collective" />
  <meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}" />
  <meta property="og:url"         content="{{ page.url | absolute_url }}" />
  <meta property="og:image"       content="{% if page.og_image %}{{ page.og_image | absolute_url }}{% else %}{{ site.og_image | absolute_url }}{% endif %}" />
  <meta property="og:site_name"   content="Tangyslice Collective" />

  <!-- Twitter/X -->
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:title"       content="{% if page.title %}{{ page.title }} — {% endif %}Tangyslice Collective" />
  <meta name="twitter:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}" />
  <meta name="twitter:image"       content="{% if page.og_image %}{{ page.og_image | absolute_url }}{% else %}{{ site.og_image | absolute_url }}{% endif %}" />

  <!-- Article meta for blog posts -->
  {% if page.layout == 'blog-post' %}
  <meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}" />
  <meta property="article:author"         content="{{ page.author }}" />
  {% endif %}

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />

    <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-8RS9GZLZ65"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-8RS9GZLZ65');
  </script>

</head>

<body class="{% if page.url == '/' %}page--home{% else %}page--{{ page.url | remove: '/' | remove: '.html' | replace: '/', '-' }}{% endif %}">

  {% include nav.html %}

  <main id="main-content">
    {{ content }}
  </main>

  {% include footer.html %}

  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>

  {% if page.turnstile %}
  <!-- Cloudflare Turnstile — loaded only on pages that set turnstile: true -->
  <script src="https://challenges.cloudflare.com/turnstile/v1/api.js" async defer></script>
  {% endif %}
</body>
</html>
