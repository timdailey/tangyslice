<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Start cookieyes banner -->
   <script id="cookieyes" type="text/javascript" src="https://cdn-cookieyes.com/client_data/814feb2301cc7e744510483b23511a17/script.js"></script> 
   <!-- End cookieyes banner -->

  <!-- Primary meta -->
  <!-- meta_title overrides the <title> tag (search/GEO); falls back to page.title + brand -->
  <title>{% if page.meta_title %}{{ page.meta_title }}{% elsif page.title %}{{ page.title }} — Tangyslice Collective{% else %}Tangyslice Collective{% endif %}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}" />
  <meta name="robots" content="{% if page.noindex %}noindex, follow{% else %}index, follow{% endif %}" />

  <!-- Canonical -->
  <link rel="canonical" href="{{ page.url | absolute_url }}" />

  <!-- Open Graph -->
  <!-- og_title / og_description override OG tags (social sharing); fall back to page.title / description -->
  <meta property="og:type"        content="{% if page.layout == 'blog-post' %}article{% else %}website{% endif %}" />
  <meta property="og:title"       content="{% if page.og_title %}{{ page.og_title }}{% elsif page.title %}{{ page.title }} — Tangyslice Collective{% else %}Tangyslice Collective{% endif %}" />
  <meta property="og:description" content="{% if page.og_description %}{{ page.og_description }}{% elsif page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}" />
  <meta property="og:url"         content="{{ page.url | absolute_url }}" />
  <meta property="og:image"       content="{% if page.og_image %}{{ page.og_image | absolute_url }}{% else %}{{ site.og_image | absolute_url }}{% endif %}" />
  <meta property="og:site_name"   content="Tangyslice Collective" />

  <!-- Twitter/X -->
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:title"       content="{% if page.og_title %}{{ page.og_title }}{% elsif page.title %}{{ page.title }} — Tangyslice Collective{% else %}Tangyslice Collective{% endif %}" />
  <meta name="twitter:description" content="{% if page.og_description %}{{ page.og_description }}{% elsif page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}" />
  <meta name="twitter:image"       content="{% if page.og_image %}{{ page.og_image | absolute_url }}{% else %}{{ site.og_image | absolute_url }}{% endif %}" />

  <!-- Article meta for blog posts -->
  {% if page.layout == 'blog-post' %}
  <meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}" />
  <meta property="article:author"         content="{{ page.author }}" />
  {% endif %}

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/img/favicon-32.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/img/favicon.png' | relative_url }}">

  <!-- Fonts: self-hosted (@font-face in main.css). Preload the latin files used above the fold. -->
  <link rel="preload" href="{{ '/assets/fonts/teko-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="{{ '/assets/fonts/inter-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="{{ '/assets/fonts/ibm-plex-serif-400-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin />

  <!-- Styles -->
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />

  <!-- Structured data -->
  {% include schema-org.html %}

    <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-8RS9GZLZ65"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-8RS9GZLZ65');
  </script>

</head>

<body class="{% if page.url == '/' %}page--home{% else %}page--{{ page.url | remove: '/' | remove: '.html' | replace: '/', '-' }}{% endif %}">

  {% include nav.html %}

  <main id="main-content">
    {{ content }}
  </main>

  {% include footer.html %}

  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>

  {% if page.turnstile %}
  <!-- Cloudflare Turnstile — loaded only on pages that set turnstile: true -->
  <script src="https://challenges.cloudflare.com/turnstile/v1/api.js" async defer></script>
  {% endif %}
</body>
</html>
